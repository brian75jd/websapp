<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed</title>
    
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap');
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{
  --ink:#0a0c10;--ink-2:#1a1d24;--ink-3:#252830;
  --surface:#f0f4fb;--surface-2:#e8f1fd;--surface-3:#dce8f8;
  --line:rgba(10,12,16,0.10);--line-2:rgba(10,12,16,0.06);
  --gold:#c9a84c;--gold-light:#f5c518;--gold-pale:#fdf7e8;
  --crimson:#cc1f1f;--crimson-pale:#fee2e2;
  --teal:#1a7a6e;--teal-pale:#eaf5f3;
  --violet:#5b4fcf;--violet-pale:#f0eefb;
  --primary:#1a6fd4;--primary-light:#3d8ef0;--primary-soft:#e8f1fd;
  --success:#22c55e;--success-pale:#dcfce7;
  --amber:#d97706;--amber-pale:#fef3c7;
  --text:#0d1a2e;--text-2:#4a4d58;--text-3:#6b82a0;
  --radius:14px;--radius-sm:10px;--radius-xs:6px;
  --shadow:0 2px 12px rgba(26,111,212,0.08);
  --font-head:'Plus Jakarta Sans',sans-serif;
  --font-body:'DM Sans',sans-serif;
}
body{font-family:var(--font-body);background:var(--surface);color:var(--text);-webkit-font-smoothing:antialiased;}

.topbar{background:var(--ink);padding:0 15px;height:54px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
.topbar-brand{font-family:var(--font-head);font-weight:800;font-size:1rem;color:var(--gold-light);display:flex;align-items:center;gap:7px;letter-spacing:-0.2px;}
.topbar-brand span{color:rgba(255,255,255,0.35);font-weight:500;font-size:0.75rem;}
.topbar-right{display:flex;align-items:center;gap:8px;}
.avatar{width:31px;height:31px;border-radius:50%;background:var(--gold);color:var(--ink);font-family:var(--font-head);font-weight:700;font-size:0.77rem;display:flex;align-items:center;justify-content:center;}
.burger{width:31px;height:31px;border-radius:var(--radius-xs);border:1px solid rgba(255,255,255,0.14);background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.75);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.88rem;transition:background 0.18s;}
.burger:hover{background:rgba(255,255,255,0.14);color:#fff;}

.search-bar-row{padding:9px 14px;background:#fff;border-bottom:1px solid var(--line);display:flex;}
.search-wrap{flex:1;position:relative;display:flex;align-items:center;}
.search-wrap i{position:absolute;left:11px;color:var(--text-3);font-size:0.78rem;pointer-events:none;}
.search-wrap input{width:100%;padding:8px 12px 8px 32px;border-radius:30px;border:1.5px solid var(--line);background:var(--surface);font-size:0.82rem;color:var(--text);outline:none;transition:border-color 0.18s;font-family:var(--font-body);}
.search-wrap input:focus{border-color:var(--primary);background:#fff;}
.search-wrap input::placeholder{color:var(--text-3);}

.filter-strip{display:flex;gap:7px;padding:10px 14px;overflow-x:auto;scrollbar-width:none;background:#fff;border-bottom:1px solid var(--line);}
.filter-strip::-webkit-scrollbar{display:none;}
.fpill{flex-shrink:0;padding:5px 13px;border-radius:30px;border:1.5px solid var(--line);background:#fff;font-family:var(--font-head);font-weight:600;font-size:0.73rem;color:var(--text-3);cursor:pointer;transition:all 0.17s;display:flex;align-items:center;gap:5px;}
.fpill:hover{border-color:var(--primary);color:var(--primary);}
.fpill.active{background:var(--ink);color:var(--gold-light);border-color:var(--ink);}
.fpill i{font-size:0.65rem;}

.page{padding:14px 13px 0;}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.sec-lbl{font-family:var(--font-head);font-weight:700;font-size:0.72rem;color:var(--text-3);text-transform:uppercase;letter-spacing:0.5px;display:flex;align-items:center;gap:6px;}
.sec-lbl i{color:var(--gold);font-size:0.68rem;}
.sec-link{font-size:0.72rem;color:var(--violet);font-weight:700;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:3px;}

.event-card{background:#fff;border-radius:var(--radius);border:1.5px solid var(--line);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px;}
.event-card.t-academic{border-top:4px solid var(--primary);}
.event-card.t-social{border-top:4px solid var(--gold-light);}
.event-card.t-sports{border-top:4px solid var(--crimson);}
.event-card.t-cultural{border-top:4px solid var(--violet);}
.event-card.t-workshop{border-top:4px solid var(--success);}

.poster-wrap{position:relative;overflow:hidden;height:205px;background:#000;cursor:pointer;}
.poster-wrap img{width:100%;height:100%;object-fit:cover;display:block;opacity:0.88;transition:transform 0.34s,opacity 0.2s;}
.poster-wrap:hover img{transform:scale(1.04);opacity:1;}
.poster-grad{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,rgba(0,0,0,0.78) 100%);pointer-events:none;}
.type-badge{position:absolute;top:10px;left:10px;border-radius:20px;padding:4px 11px;font-family:var(--font-head);font-weight:700;font-size:0.67rem;letter-spacing:0.3px;text-transform:uppercase;}
.tb-academic{background:var(--primary);color:#fff;}
.tb-social{background:var(--gold-light);color:var(--ink);}
.tb-sports{background:var(--crimson);color:#fff;}
.tb-cultural{background:var(--violet);color:#fff;}
.tb-workshop{background:var(--success);color:#fff;}
.poster-dl{position:absolute;top:9px;right:9px;width:32px;height:32px;border-radius:50%;border:none;background:rgba(0,0,0,0.46);color:#fff;font-size:0.78rem;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.2s;text-decoration:none;}
.poster-wrap:hover .poster-dl{opacity:1;}
.poster-bottom{position:absolute;bottom:0;left:0;right:0;padding:11px 13px 13px;pointer-events:none;}
.poster-name{font-family:var(--font-head);font-weight:800;font-size:1rem;color:#fff;line-height:1.3;margin-bottom:2px;}
.poster-org{font-size:0.71rem;color:rgba(255,255,255,0.68);}

.ev-body{padding:12px 14px 13px;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px;}
.info-cell{display:flex;align-items:flex-start;gap:8px;}
.info-cell.full{grid-column:1/-1;}
.iico{width:29px;height:29px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:0.74rem;flex-shrink:0;margin-top:1px;}
.ic-cal{background:var(--primary-soft);color:var(--primary);}
.ic-clk{background:var(--amber-pale);color:var(--amber);}
.ic-loc{background:var(--success-pale);color:#166534;}
.ic-tkt{background:var(--crimson-pale);color:#991b1b;}
.info-lbl{font-size:0.62rem;color:var(--text-3);font-weight:600;text-transform:uppercase;letter-spacing:0.3px;}
.info-val{font-size:0.82rem;color:var(--text);font-weight:500;margin-top:1px;line-height:1.4;}

.ev-desc{font-size:0.81rem;color:var(--text-2);line-height:1.65;border-top:1px solid var(--line);padding-top:10px;margin-bottom:11px;}
.rm-btn{background:none;border:none;color:var(--primary);font-size:0.79rem;font-weight:600;cursor:pointer;padding:0;margin-left:3px;}

.ev-footer{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:10px;}
.av-stack{display:flex;}
.av-stack img{width:24px;height:24px;border-radius:50%;object-fit:cover;border:2px solid #fff;margin-left:-7px;}
.av-stack img:first-child{margin-left:0;}
.av-label{font-size:0.73rem;color:var(--text-3);}
.plan-btn{margin-left:auto;padding:8px 16px;border-radius:30px;border:none;font-family:var(--font-head);font-weight:700;font-size:0.79rem;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0;}
.plan-btn.off{background:var(--ink);color:var(--gold-light);}
.plan-btn.off:hover{background:var(--ink-3);}
.plan-btn.on{background:var(--crimson);color:#fff;}
.buy-btn{margin-left:auto;padding:8px 16px;border-radius:30px;border:none;font-family:var(--font-head);font-weight:700;font-size:0.79rem;cursor:pointer;background:var(--primary);color:#fff;display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0;transition:all 0.2s;}
.buy-btn:hover{background:var(--primary-light);}

.vac-card{background:#fff;border-radius:var(--radius);border:1.5px solid var(--line);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px;}
.vac-card-top{display:flex;align-items:stretch;min-width:0;}
.vac-accent{width:5px;flex-shrink:0;}
.vac-inner{padding:12px 13px;flex:1;min-width:0;}
.vac-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;}
.vac-role{font-family:var(--font-head);font-weight:700;font-size:0.86rem;color:var(--text);line-height:1.35;}
.vac-pay{font-family:var(--font-head);font-weight:700;font-size:0.82rem;color:var(--teal);white-space:nowrap;flex-shrink:0;}
.vac-org{font-size:0.71rem;color:var(--text-3);margin-bottom:7px;font-weight:500;}
.vac-meta-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.vac-tag{font-size:0.59rem;font-weight:700;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:0.3px;font-family:var(--font-head);}
.vt-full{background:var(--teal-pale);color:var(--teal);}
.vt-part{background:var(--gold-pale);color:var(--amber);}
.vt-vol{background:var(--violet-pale);color:var(--violet);}
.vac-deadline{font-size:0.65rem;color:var(--text-3);font-weight:600;display:flex;align-items:center;gap:3px;margin-left:auto;}
.vac-footer{padding:8px 13px 10px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.vac-location{font-size:0.69rem;color:var(--text-3);display:flex;align-items:center;gap:4px;font-weight:500;}
.apply-btn{padding:6px 14px;border-radius:20px;border:none;background:var(--ink);color:var(--gold-light);font-family:var(--font-head);font-weight:700;font-size:0.72rem;cursor:pointer;transition:all 0.18s;}
.apply-btn:hover{background:var(--ink-3);}

.match-card{background:#fff;border-radius:var(--radius);border:1.5px solid var(--line);box-shadow:var(--shadow);overflow:hidden;margin-bottom:12px;}
.match-card-top{display:flex;align-items:stretch;}
.match-accent{width:5px;flex-shrink:0;}
.match-inner{padding:11px 13px 12px;flex:1;}
.match-league-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.match-league{font-size:0.63rem;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--text-3);display:flex;align-items:center;gap:5px;}
.match-league i{color:var(--gold);font-size:0.67rem;}
.match-status-badge{font-size:0.62rem;font-weight:700;padding:2px 8px;border-radius:20px;font-family:var(--font-head);}
.ms-live{background:var(--crimson-pale);color:var(--crimson);}
.ms-ft{background:var(--surface-2);color:var(--text-3);}
.ms-up{background:var(--teal-pale);color:var(--teal);}
.match-row{display:flex;align-items:center;gap:10px;}
.match-team{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;}
.match-logo{width:36px;height:36px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:700;font-size:0.72rem;color:var(--text-2);border:1.5px solid var(--line);}
.match-tname{font-family:var(--font-head);font-weight:700;font-size:0.77rem;color:var(--text);text-align:center;}
.match-score-wrap{text-align:center;flex-shrink:0;padding:0 6px;}
.match-score{font-family:var(--font-head);font-weight:800;font-size:1.3rem;color:var(--text);letter-spacing:2px;line-height:1;}
.match-score-lbl{font-size:0.62rem;color:var(--text-3);margin-top:3px;font-weight:600;}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--crimson);margin-right:3px;vertical-align:middle;}

.backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.52);z-index:500;display:none;}
.backdrop.open{display:block;}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(300px,88vw);background:var(--ink);z-index:501;display:flex;flex-direction:column;transform:translateX(110%);transition:transform 0.3s cubic-bezier(0.32,0.72,0,1);overflow-y:auto;}
.drawer.open{transform:translateX(0);}
.dr-head{background:var(--ink-2);padding:17px 15px 13px;border-bottom:1px solid rgba(255,255,255,0.07);flex-shrink:0;}
.dr-head-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;}
.dr-title{font-family:var(--font-head);font-weight:800;font-size:0.94rem;color:var(--gold-light);display:flex;align-items:center;gap:7px;}
.dr-close{width:32px;height:32px;border:none;background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.6);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.85rem;transition:background 0.2s;}
.dr-close:hover{background:rgba(255,255,255,0.14);color:#fff;}
.dr-sub{font-size:0.71rem;color:rgba(255,255,255,0.35);font-weight:500;}
.dr-body{flex:1;overflow-y:auto;padding:10px 10px 6px;}
.dr-body::-webkit-scrollbar{width:3px;}
.dr-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:4px;}
.dr-sec-lbl{font-size:0.63rem;font-weight:700;color:rgba(255,255,255,0.28);text-transform:uppercase;letter-spacing:0.6px;padding:10px 6px 6px;display:block;}
.dr-nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);cursor:pointer;color:rgba(255,255,255,0.78);font-size:0.84rem;font-weight:600;transition:background 0.17s;border:none;background:none;width:100%;text-align:left;text-decoration:none;font-family:var(--font-body);}
.dr-nav-item:hover{background:rgba(255,255,255,0.07);color:#fff;}
.dr-nav-item i{font-size:0.84rem;color:var(--gold-light);width:18px;text-align:center;flex-shrink:0;}
.dr-divider{height:1px;background:rgba(255,255,255,0.07);margin:6px 0;}

.planned-section{padding:10px 10px 0;}
.planned-sec-title{font-size:0.63rem;font-weight:700;color:rgba(255,255,255,0.28);text-transform:uppercase;letter-spacing:0.6px;padding:0 6px 8px;display:block;}
.planned-ev{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:var(--radius-sm);padding:9px 10px;margin-bottom:7px;transition:opacity 0.25s,transform 0.25s;}
.pev-thumb{width:44px;height:44px;border-radius:var(--radius-xs);flex-shrink:0;background:var(--ink-3);display:flex;align-items:center;justify-content:center;font-size:1.1rem;overflow:hidden;}
.pev-thumb img{width:100%;height:100%;object-fit:cover;}
.pev-info{flex:1;min-width:0;}
.pev-name{font-size:0.79rem;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--font-head);}
.pev-time{font-size:0.64rem;color:var(--gold-light);margin-top:3px;display:flex;align-items:center;gap:3px;font-weight:600;}
.pev-venue{font-size:0.63rem;color:rgba(255,255,255,0.38);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pev-del{width:28px;height:28px;border:none;background:rgba(192,57,43,0.18);color:#f87171;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:0.66rem;flex-shrink:0;transition:all 0.17s;}
.pev-del:hover{background:var(--crimson);color:#fff;}
.planned-empty{text-align:center;padding:20px 16px 10px;}
.planned-empty i{font-size:1.8rem;color:rgba(255,255,255,0.12);display:block;margin-bottom:8px;}
.planned-empty p{font-size:0.77rem;color:rgba(255,255,255,0.3);line-height:1.6;}
.clear-all-btn{width:100%;padding:9px;border-radius:30px;border:1px solid rgba(204,31,31,0.4);background:transparent;color:#f87171;font-family:var(--font-head);font-weight:600;font-size:0.79rem;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 0 12px;}
.clear-all-btn:hover{background:var(--crimson);color:#fff;border-color:var(--crimson);}

.confirm-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.55);z-index:700;display:none;align-items:flex-end;justify-content:center;min-height:100vh;}
.confirm-overlay.open{display:flex;}
.confirm-sheet{background:#fff;width:100%;max-width:420px;border-radius:var(--radius) var(--radius) 0 0;padding:16px 15px 26px;}
.confirm-handle{width:34px;height:4px;background:var(--surface-2);border-radius:4px;margin:0 auto 13px;}
.confirm-title{font-family:var(--font-head);font-weight:800;font-size:0.93rem;color:var(--text);margin-bottom:7px;}
.confirm-text{font-size:0.79rem;color:var(--text-2);line-height:1.65;margin-bottom:15px;}
.confirm-actions{display:flex;gap:8px;}
.c-cancel{flex:1;padding:10px;border-radius:var(--radius-sm);border:1.5px solid var(--line);background:#fff;font-family:var(--font-body);font-weight:700;font-size:0.8rem;cursor:pointer;color:var(--text-2);}
.c-delete{flex:1;padding:10px;border-radius:var(--radius-sm);border:none;background:var(--crimson);color:#fff;font-family:var(--font-head);font-weight:700;font-size:0.8rem;cursor:pointer;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--gold-light);border:1px solid rgba(201,168,76,0.22);padding:8px 18px;border-radius:30px;font-size:0.77rem;font-weight:700;opacity:0;transition:all 0.28s;pointer-events:none;z-index:9999;white-space:nowrap;font-family:var(--font-body);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:translateY(0);}}
@keyframes liveBlink{0%,100%{opacity:1;}50%{opacity:0.4;}}
.live-blink{animation:liveBlink 1.3s ease-in-out infinite;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-brand">
    <i class="fa-solid fa-bolt" style="font-size:0.8rem;" aria-hidden="true"></i>
    MZUNI <span>Events</span>
  </div>
  <div class="topbar-right">
    <div class="avatar" aria-label="User JB">JB</div>
    <button class="burger" onclick="openDrawer()" aria-label="Open menu">
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>
  </div>
</div>

<div class="search-bar-row">
  <div class="search-wrap">
    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
    <input type="text" placeholder="Search events, venues, organisers…" aria-label="Search">
  </div>
</div>

<div class="filter-strip">
  <button class="fpill active" onclick="setFilter('all',this)">All Events</button>
  <button class="fpill" onclick="setFilter('academic',this)"><i class="fa-solid fa-book-open" aria-hidden="true"></i>Academic</button>
  <button class="fpill" onclick="setFilter('social',this)"><i class="fa-solid fa-users" aria-hidden="true"></i>Social</button>
  <button class="fpill" onclick="setFilter('sports',this)"><i class="fa-solid fa-futbol" aria-hidden="true"></i>Sports</button>
  <button class="fpill" onclick="setFilter('cultural',this)"><i class="fa-solid fa-masks-theater" aria-hidden="true"></i>Cultural</button>
  <button class="fpill" onclick="setFilter('workshop',this)"><i class="fa-solid fa-screwdriver-wrench" aria-hidden="true"></i>Workshop</button>
</div>

<div class="page">

  <div class="sec-head" style="margin-bottom:10px;">
    <div class="sec-lbl"><i class="fa-solid fa-calendar-days" aria-hidden="true"></i> Upcoming Events</div>
    <a class="sec-link" href="#" aria-label="See all events">See all <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
  </div>

  <div id="eventList"></div>

  <div class="sec-head" style="margin-top:4px;margin-bottom:10px;">
    <div class="sec-lbl"><i class="fa-solid fa-briefcase" aria-hidden="true"></i> Open Vacancies</div>
    <a class="sec-link" href="#" aria-label="See all vacancies">See all <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
  </div>
  <div id="vacList"></div>

  <div class="sec-head" style="margin-bottom:10px;">
    <div class="sec-lbl"><i class="fa-solid fa-futbol" aria-hidden="true"></i> Sports Updates</div>
    <a class="sec-link" href="#" aria-label="See all sports">See all <i class="fa-solid fa-arrow-right" aria-hidden="true"></i></a>
  </div>
  <div id="sportsList"></div>

</div>

<div class="backdrop" id="backdrop" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer" role="dialog" aria-label="Navigation menu">
  <div class="dr-head">
    <div class="dr-head-row">
      <div class="dr-title"><i class="fa-solid fa-star" style="font-size:0.8rem;" aria-hidden="true"></i> Menu</div>
      <button class="dr-close" onclick="closeDrawer()" aria-label="Close menu"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </div>
    <div class="dr-sub">Welcome back, John</div>
  </div>
  <div class="dr-body">
    <span class="dr-sec-lbl">Account</span>
    <button class="dr-nav-item"><i class="fa-solid fa-right-from-bracket" aria-hidden="true"></i> Logout</button>
    <button class="dr-nav-item"><i class="fa-solid fa-building" aria-hidden="true"></i> Create Organiser account</button>
    <button class="dr-nav-item"><i class="fa-solid fa-user-plus" aria-hidden="true"></i> Create user account</button>
    <div class="dr-divider"></div>
    <span class="dr-sec-lbl">My Events</span>
    <button class="dr-nav-item"><i class="fa-solid fa-ticket" aria-hidden="true"></i> My Tickets</button>
    <button class="dr-nav-item"><i class="fa-solid fa-chart-line" aria-hidden="true"></i> Dashboard</button>
    <div class="dr-divider"></div>

    <div class="planned-section">
      <span class="planned-sec-title">My Planned Events <span id="drPlannedCount" style="background:rgba(192,57,43,0.28);color:#f87171;font-size:0.58rem;padding:1px 6px;border-radius:10px;margin-left:4px;display:none;"></span></span>
      <div id="drPlannedList"></div>
      <div id="drEmpty" class="planned-empty">
        <i class="fa-regular fa-calendar-xmark" aria-hidden="true"></i>
        <p>No planned events yet.<br>Tap <strong style="color:var(--gold-light);">Plan to Attend</strong> on any event.</p>
      </div>
      <button class="clear-all-btn" id="clearAllBtn" style="display:none;" onclick="clearAll()"><i class="fa-solid fa-trash-can" aria-hidden="true"></i> Clear all planned events</button>
    </div>
  </div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-sheet">
    <div class="confirm-handle"></div>
    <div class="confirm-title">Remove Attendance?</div>
    <div class="confirm-text">Are you sure you want to remove your attendance for <strong id="confirmName"></strong>? This cannot be undone.</div>
    <div class="confirm-actions">
      <button class="c-cancel" onclick="closeConfirm()">Keep it</button>
      <button class="c-delete" id="confirmYes">Yes, Remove</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const EVENTS = [
  {id:1,type:'academic',title:'Annual Science Fair 2025',org:'Faculty of Science · MZUNI',date:'May 15, 2025',start:'09:00',end:'17:00',venue:'MZUNI Main Hall',desc:'A showcase of student research projects across all science disciplines. Exhibits, demos, prizes and guest lectures from leading academics and industry professionals.',is_paid:false,poster:'https://images.unsplash.com/photo-1564069114051-6a12914679e7?w=600&q=70',seeds:['alice','bob','carol']},
  {id:2,type:'social',title:'Cultural Night 2025',org:'MZUNI Student Union',date:'May 22, 2025',start:'18:00',end:'22:30',venue:'Open Air Stage',desc:'An evening celebrating the diverse cultures of MZUNI students. Performances, food, fashion and more. Tickets include dinner.',is_paid:true,price:'MK 1,000',tickets_left:'142 tickets left',poster:'https://images.unsplash.com/photo-1533174072545-7a4b6ad7a6c3?w=600&q=70',seeds:['dave','eve','frank']},
  {id:3,type:'sports',title:'Inter-Faculty Sports Day',org:'MZUNI Sports Council',date:'Jun 1, 2025',start:'08:00',end:'16:00',venue:'MZUNI Sports Ground',desc:'Annual inter-faculty competition featuring football, basketball, volleyball, athletics and more. Come support your faculty!',is_paid:false,poster:'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?w=600&q=70',seeds:['grace','henry','ivy']},
  {id:4,type:'workshop',title:'Tech Talk: AI Futures',org:'CS Department · MZUNI',date:'Jun 8, 2025',start:'14:00',end:'17:00',venue:'ICT Lab 3',desc:'Industry experts discuss how artificial intelligence is reshaping careers, research and society. Open to all students and staff.',is_paid:false,poster:'https://images.unsplash.com/photo-1677442135703-1787eea5ce01?w=600&q=70',seeds:['jack','karen','leo']},
  {id:5,type:'academic',title:'Research Symposium',org:'Postgraduate Office · MZUNI',date:'Jun 15, 2025',start:'09:00',end:'16:00',venue:'Senate Chamber',desc:'A platform for postgraduate students to present research findings. Keynote addresses, paper presentations and a networking lunch.',is_paid:true,price:'MK 500',tickets_left:'88 tickets left',poster:'https://images.unsplash.com/photo-1506784983877-45594efa4cbe?w=600&q=70',seeds:['mia','noah','olivia']},
];
const VACANCIES=[
  {id:1,role:'Research Assistant — Computer Science',org:'Faculty of Science · MZUNI',type:'part',pay:'MK 15K/mo',location:'On-campus',deadline:'Closes May 20',accent:'#1a6fd4'},
  {id:2,role:'Student Union Events Coordinator',org:'MZUNI Student Union',type:'vol',pay:'Volunteer',location:'On-campus',deadline:'Closes May 25',accent:'#1a7a6e'},
  {id:3,role:'Graduate Intern — Business Development',org:'NICO Holdings PLC',type:'full',pay:'MK 45K/mo',location:'Blantyre',deadline:'Closes Jun 5',accent:'#c9a84c'},
  {id:4,role:'Library Assistant',org:'MZUNI Library Services',type:'part',pay:'MK 8K/mo',location:'On-campus',deadline:'Closes Jun 2',accent:'#cc1f1f'},
];
const SPORTS=[
  {id:1,league:'MZUNI Football League · Semifinal',t1:'Science FC',t1s:'SCI',t2:'Law United',t2s:'LAW',score:'2 – 1',status:'live',time:"72'",accent:'#cc1f1f'},
  {id:2,league:'MZUNI Basketball Cup',t1:'Engineering',t1s:'ENG',t2:'Med School',t2s:'MED',score:'68 – 71',status:'ft',accent:'#1a6fd4'},
  {id:3,league:'MZUNI Volleyball League',t1:'Education',t1s:'ED',t2:'Agriculture',t2s:'AGR',score:'vs',status:'upcoming',time:'Tomorrow 14:00',accent:'#1a7a6e'},
];
const TYPE_TOP={academic:'#1a6fd4',social:'#f5c518',sports:'#cc1f1f',cultural:'#5b4fcf',workshop:'#22c55e'};
const TYPE_BADGE={academic:'tb-academic',social:'tb-social',sports:'tb-sports',cultural:'tb-cultural',workshop:'tb-workshop'};
const TYPE_LBL={academic:'Academic',social:'Social',sports:'Sports',cultural:'Cultural',workshop:'Workshop'};
const VAC_TYPE={full:{cls:'vt-full',lbl:'Full-time'},part:{cls:'vt-part',lbl:'Part-time'},vol:{cls:'vt-vol',lbl:'Volunteer'}};

let planned=new Set();
let activeFilter='all';
let pendingDeleteId=null;

function setFilter(t,btn){
  activeFilter=t;
  document.querySelectorAll('.fpill').forEach(p=>p.classList.remove('active'));
  btn.classList.add('active');
  renderEvents();
}

function renderEvents(){
  const list=document.getElementById('eventList');
  let evs=activeFilter==='all'?EVENTS:EVENTS.filter(e=>e.type===activeFilter);
  if(!evs.length){list.innerHTML=`<div style="text-align:center;padding:50px 20px;color:var(--text-3);font-size:0.83rem;">No events in this category yet.</div>`;return;}
  list.innerHTML=evs.map((ev,i)=>evCardHTML(ev,i)).join('');
}

function evCardHTML(ev,i){
  const on=planned.has(ev.id);
  const words=ev.desc.split(' ');
  const short=words.slice(0,20).join(' ');
  const hasMore=words.length>20;
  const stack=[`https://api.dicebear.com/7.x/avataaars/svg?seed=${ev.seeds[0]}`,`https://api.dicebear.com/7.x/avataaars/svg?seed=${ev.seeds[1]}`,`https://api.dicebear.com/7.x/avataaars/svg?seed=${ev.seeds[2]}`].map(s=>`<img src="${s}" alt="attendee"/>`).join('');
  return`<div class="event-card t-${ev.type}" style="animation:fadeUp 0.32s ease ${i*0.06}s both;" id="ecard-${ev.id}">
  <div class="poster-wrap" onclick="openLb('${ev.poster}','${ev.title}')">
    <img src="${ev.poster}" alt="${ev.title}" loading="lazy"/>
    <div class="poster-grad"></div>
    <span class="type-badge ${TYPE_BADGE[ev.type]}">${TYPE_LBL[ev.type]}</span>
    <a class="poster-dl" href="${ev.poster}" download="poster.jpg" title="Download poster" onclick="event.stopPropagation();showToast('Downloading poster…')"><i class="fa-solid fa-download" aria-hidden="true"></i></a>
    <div class="poster-bottom">
      <div class="poster-name">${ev.title}</div>
      <div class="poster-org">${ev.org}</div>
    </div>
  </div>
  <div class="ev-body">
    <div class="info-grid">
      <div class="info-cell"><div class="iico ic-cal"><i class="fa-solid fa-calendar-day" aria-hidden="true"></i></div><div><div class="info-lbl">Date</div><div class="info-val">${ev.date}</div></div></div>
      <div class="info-cell"><div class="iico ic-clk"><i class="fa-regular fa-clock" aria-hidden="true"></i></div><div><div class="info-lbl">Time</div><div class="info-val">${ev.start} – ${ev.end}</div></div></div>
      <div class="info-cell full"><div class="iico ic-loc"><i class="fa-solid fa-location-dot" aria-hidden="true"></i></div><div><div class="info-lbl">Venue</div><div class="info-val">${ev.venue}</div></div></div>
      ${ev.is_paid?`<div class="info-cell full"><div class="iico ic-tkt"><i class="fa-solid fa-ticket" aria-hidden="true"></i></div><div><div class="info-lbl">Tickets</div><div class="info-val">${ev.tickets_left}</div></div></div>`:''}
    </div>
    <div class="ev-desc"><span class="dv">${short}</span><span class="de" style="display:none"> ${words.slice(20).join(' ')}</span>${hasMore?`<button class="rm-btn" onclick="togDesc(this)">…more</button>`:''}</div>
    <div class="ev-footer">
      ${!ev.is_paid?`<div class="av-stack">${stack}</div><span class="av-label">6 interested</span>`:''}
      ${ev.is_paid
        ?`<span style="font-family:var(--font-head);font-weight:800;font-size:1rem;color:var(--text);">${ev.price}</span><button class="plan-btn off"><i class="fa-solid fa-wallet" aria-hidden="true"></i> Buy Ticket</button>`
        :`<button class="plan-btn ${on?'on':'off'}" id="pb-${ev.id}" onclick="togglePlan(${ev.id})"><i class="fa-${on?'solid fa-check':'regular fa-calendar-plus'}" aria-hidden="true"></i> ${on?'Planned':'Plan to Attend'}</button>`}
    </div>
  </div>
</div>`;
}

function renderVacancies(){
  document.getElementById('vacList').innerHTML=VACANCIES.map((v,i)=>{
    const vt=VAC_TYPE[v.type];
    return`<div class="vac-card" style="animation:fadeUp 0.32s ease ${i*0.06}s both;">
  <div class="vac-card-top">
    <div class="vac-accent" style="background:${v.accent};"></div>
    <div class="vac-inner">
      <div class="vac-title-row">
        <div class="vac-role">${v.role}</div>
        <div class="vac-pay">${v.pay}</div>
      </div>
      <div class="vac-org">${v.org}</div>
      <div class="vac-meta-row">
        <span class="vac-tag ${vt.cls}">${vt.lbl}</span>
        <span class="vac-deadline"><i class="fa-regular fa-clock" style="font-size:0.6rem;" aria-hidden="true"></i>${v.deadline}</span>
      </div>
    </div>
  </div>
  <div class="vac-footer">
    <div class="vac-location"><i class="fa-solid fa-location-dot" style="font-size:0.65rem;" aria-hidden="true"></i>${v.location}</div>
    <button class="apply-btn">Apply Now</button>
  </div>
</div>`;}).join('');
}

function renderSports(){
  document.getElementById('sportsList').innerHTML=SPORTS.map((m,i)=>{
    const isLive=m.status==='live';
    const isFt=m.status==='ft';
    const statusCls=isLive?'ms-live':isFt?'ms-ft':'ms-up';
    const statusLbl=isLive?`<span class="live-dot live-blink"></span>LIVE ${m.time}`:isFt?'FT':`${m.time}`;
    return`<div class="match-card" style="animation:fadeUp 0.32s ease ${i*0.06}s both;">
  <div class="match-card-top">
    <div class="match-accent" style="background:${m.accent};"></div>
    <div class="match-inner">
      <div class="match-league-row">
        <div class="match-league"><i class="fa-solid fa-trophy" aria-hidden="true"></i>${m.league}</div>
        <span class="match-status-badge ${statusCls}">${statusLbl}</span>
      </div>
      <div class="match-row">
        <div class="match-team">
          <div class="match-logo">${m.t1s}</div>
          <div class="match-tname">${m.t1}</div>
        </div>
        <div class="match-score-wrap">
          <div class="match-score">${m.score}</div>
          <div class="match-score-lbl">${isFt?'Full Time':isLive?'Live':'Upcoming'}</div>
        </div>
        <div class="match-team">
          <div class="match-logo">${m.t2s}</div>
          <div class="match-tname">${m.t2}</div>
        </div>
      </div>
    </div>
  </div>
</div>`;}).join('');
}

function togDesc(btn){
  const desc=btn.closest('.ev-desc');
  const extra=desc.querySelector('.de');
  const shown=extra.style.display!=='none';
  extra.style.display=shown?'none':'inline';
  btn.textContent=shown?'…more':' less';
}

function togglePlan(id){
  const on=planned.has(id);
  if(on){askDelete(id,EVENTS.find(e=>e.id===id).title);}
  else{
    planned.add(id);
    updatePlanBtn(id,true);
    rebuildDrawerList();
    showToast('Added to your planned events 🎉');
  }
}

function updatePlanBtn(id,on){
  const btn=document.getElementById(`pb-${id}`);
  if(!btn)return;
  btn.className=`plan-btn ${on?'on':'off'}`;
  btn.innerHTML=`<i class="fa-${on?'solid fa-check':'regular fa-calendar-plus'}" aria-hidden="true"></i> ${on?'Planned':'Plan to Attend'}`;
}

function rebuildDrawerList(){
  const listEl=document.getElementById('drPlannedList');
  const empty=document.getElementById('drEmpty');
  const clearBtn=document.getElementById('clearAllBtn');
  const countEl=document.getElementById('drPlannedCount');
  const n=planned.size;
  listEl.innerHTML='';
  if(n===0){empty.style.display='block';clearBtn.style.display='none';countEl.style.display='none';return;}
  empty.style.display='none';
  clearBtn.style.display='flex';
  countEl.style.display='inline';
  countEl.textContent=n;
  [...planned].forEach((id,idx)=>{
    const ev=EVENTS.find(e=>e.id===id);if(!ev)return;
    const d=document.createElement('div');
    d.className='planned-ev';d.id=`pev-${ev.id}`;
    d.style.animationDelay=`${idx*0.05}s`;
    d.innerHTML=`<div class="pev-thumb"><img src="${ev.poster}" alt="${ev.title}" loading="lazy"/></div>
<div class="pev-info">
  <div class="pev-name">${ev.title}</div>
  <div class="pev-time"><i class="fa-solid fa-calendar-day" style="font-size:0.6rem;" aria-hidden="true"></i>${ev.date}</div>
  <div class="pev-venue">${ev.venue}</div>
</div>
<button class="pev-del" onclick="askDelete(${ev.id},'${ev.title.replace(/'/g,"\\'")}',true)" aria-label="Remove ${ev.title}"><i class="fa-solid fa-trash-can" aria-hidden="true"></i></button>`;
    listEl.appendChild(d);
  });
}

let pendingDeleteName='';
let pendingFromDrawer=false;
function askDelete(id,name,fromDrawer=false){
  pendingDeleteId=id;pendingDeleteName=name;pendingFromDrawer=fromDrawer;
  document.getElementById('confirmName').textContent=name;
  document.getElementById('confirmOverlay').classList.add('open');
}
function closeConfirm(){document.getElementById('confirmOverlay').classList.remove('open');pendingDeleteId=null;}
document.getElementById('confirmYes').onclick=function(){
  if(!pendingDeleteId)return;
  planned.delete(pendingDeleteId);
  const pev=document.getElementById(`pev-${pendingDeleteId}`);
  if(pev){pev.style.opacity='0';pev.style.transform='translateX(20px)';setTimeout(()=>{pev.remove();rebuildDrawerList();},240);}
  else{rebuildDrawerList();}
  updatePlanBtn(pendingDeleteId,false);
  closeConfirm();
  showToast('Attendance removed');
};
function clearAll(){
  planned.forEach(id=>updatePlanBtn(id,false));
  planned.clear();rebuildDrawerList();showToast('All planned events cleared');
}

function openDrawer(){
  document.getElementById('drawer').classList.add('open');
  document.getElementById('backdrop').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
}

function openLb(src,name){
  event.stopPropagation();
}

let toastT;
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2700);
}

renderEvents();
renderVacancies();
renderSports();
rebuildDrawerList();
</script>

    
</body>
</html>
